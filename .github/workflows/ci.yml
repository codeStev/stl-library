name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:
  # Manual run from the GitHub UI or `gh workflow run ci.yml`. By default it
  # only builds and tests; the `publish` input opts in to pushing the image
  # (and, against a vX.Y.Z tag, cutting a release).
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the image to the registry (and cut a release, if run against a vX.Y.Z tag)"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Go (vet + test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...

  web:
    name: Web UI (typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Typecheck and build
        working-directory: web
        run: npm run build

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: [go, web]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -f deploy/combined/Dockerfile -t stl-library:ci .

  publish:
    name: Publish image to private registry
    runs-on: ubuntu-latest
    needs: [docker]
    # main pushes keep `latest` (+ SHA) current; a vX.Y.Z tag also publishes
    # semver tags. A manual run publishes only with `publish` checked.
    if: |
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # The registry is reachable only from the tailnet; join it for this
      # job as an ephemeral node.
      - name: Connect to tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci
      # Self-signed internal CA: trust it per registry via certs.d (no
      # daemon restart). The "docker" buildx driver uses the host daemon,
      # so it honors certs.d.
      - name: Trust registry CA certificate
        run: |
          sudo mkdir -p "/etc/docker/certs.d/${{ vars.REGISTRY_HOST }}"
          printf '%s\n' "${{ secrets.REGISTRY_CA_CERT }}" | \
            sudo tee "/etc/docker/certs.d/${{ vars.REGISTRY_HOST }}/ca.crt" > /dev/null
      - uses: docker/setup-buildx-action@v4
        with:
          driver: docker
      - name: Log in to registry
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.REGISTRY_HOST }}/stl-library
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,enable={{is_default_branch}}
            type=sha,format=short,prefix=,suffix=-snapshot,enable={{is_default_branch}}
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=semver,pattern={{version}},suffix=-release
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/combined/Dockerfile
          push: true
          build-args: VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish]
    if: |
      startsWith(github.ref, 'refs/tags/v') &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create release with auto-generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --generate-notes
