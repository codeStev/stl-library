# Runs the image published by CI. Copy .env.example to .env and adjust
# before `docker compose up -d`. Requires `docker login <REGISTRY_HOST>`
# first if the registry needs auth.
#
# Sign-in is built in (the first account registered becomes the admin), but
# there is no HTTPS - bound to 127.0.0.1 by default; put a TLS reverse proxy
# in front (or keep it on a network you trust, e.g. Tailscale/WireGuard).

services:
  stl-library:
    image: ${REGISTRY_HOST}/stl-library:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      SCAN_INTERVAL: ${SCAN_INTERVAL:-1h}
      # Importing from a downloads folder: set IMPORT_PATH in .env and use
      # the override file (docker-compose.import.yml), see the README.
      IMPORT_INTERVAL: ${IMPORT_INTERVAL:-1h}
      IMPORT_SETTLE: ${IMPORT_SETTLE:-1h}
      # Optional default printer; the Settings page can set it instead.
      PRINTER_ADDR: ${PRINTER_ADDR:-}
      # Sign-in (see .env.example).
      PUBLIC_URL: ${PUBLIC_URL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      APP_SECRET: ${APP_SECRET:-}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
    ports:
      - "${APP_BIND_HOST:-127.0.0.1}:${APP_PORT:-8080}:8080"
    volumes:
      # The library is only ever read.
      - ${LIBRARY_PATH:?set LIBRARY_PATH in .env}:/library:ro
      # Index and thumbnail cache.
      - data:/data

volumes:
  data:
